name: moatmat_teacher
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 2.0.0+105

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  cached_network_image: ^3.3.1
  camera: ^0.11.0+1
  chewie: ^1.11.3
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  dio: ^5.8.0+1
  encrypt: ^5.0.3
  equatable: ^2.0.5
  excel: ^4.0.2
  file_picker: ^8.0.0+1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.2.7
  flick_video_player: ^0.9.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_colorpicker: ^1.0.3
  flutter_local_notifications: ^19.3.0
  flutter_localizations:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  flutter_speed_dial: ^7.0.0
  flutter_svg: ^2.0.10+1
  fluttertoast: ^8.2.8
  get_it: ^8.0.0
  hive_flutter: ^1.1.0
  http: ^1.2.2
  image_picker: ^1.0.7
  intl: ^0.20.2
  open_file: ^3.3.2
  package_info_plus: ^8.0.2
  path_provider: ^2.1.3
  pdf: ^3.11.3
  permission_handler: ^12.0.0+1
  qr_code_scanner_plus: ^2.0.10+1
  qr_flutter: ^4.1.0
  rename: ^3.0.2
  screenshot: ^3.0.0
  share_plus: ^10.0.2
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  supabase_flutter: ^2.6.0
  timeago: ^3.7.1
  translator: ^1.0.0
  url_launcher: ^6.2.6
  video_player: ^2.8.6
  webview_flutter_plus: ^0.4.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  assets:
    - assets/fonts/Tajawal/
    - assets/fonts/Arial/
    - assets/math/
    - assets/images/boarding/
    - assets/images/other/
    - assets/images/home/
    - assets/images/apps/
    - assets/images/materials/
    - assets/images/start/
    - assets/images/centers/
    - assets/images/teachers/
    - assets/images/governorates/
  #   - images/a_dot_ham.jpeg
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-ExtraLight.ttf
          weight: 100
        - asset: assets/fonts/Tajawal/Tajawal-Light.ttf
          weight: 200
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
          weight: 300
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 400
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-ExtraBold.ttf
          weight: 600
        - asset: assets/fonts/Tajawal/Tajawal-Black.ttf
          weight: 700
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial/arial.ttf
          weight: 300
        - asset: assets/fonts/Arial/arial-bold.ttf
          weight: 500
